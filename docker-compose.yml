services:
  postgres:
    image: postgres:16-alpine
    container_name: comparison-postgres
    environment:
      POSTGRES_DB: comparison
      POSTGRES_USER: comp_user
      POSTGRES_PASSWORD: comp_local_pass
    ports: ['5442:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Real, local-dev-only TLS enablement (connector_test_1 fast-follow,
      # 2026-08-24) — see scripts/dev-tls/init-ssl.sh's own doc comment.
      # Runs once on a fresh volume; the cert/key are disposable, publicly
      # -committed, CN=localhost dev certs, never a real secret.
      - ./scripts/dev-tls/init-ssl.sh:/docker-entrypoint-initdb.d/init-ssl.sh:ro
      - ./scripts/dev-tls:/docker-entrypoint-initdb.d/tls:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comp_user -d comparison']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: askabd-mailpit
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
