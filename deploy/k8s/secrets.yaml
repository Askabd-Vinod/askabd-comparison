apiVersion: v1
kind: Secret
metadata:
  name: comparison-secrets
type: Opaque
stringData:
  database-url: "postgresql://comp_user:CHANGE_ME@postgres:5432/comparison"
  # Required for the API to verify any incoming JWT in production — without this key
  # (or jwks-url below), NODE_ENV=production forces devBypass to false and every
  # authenticated request will fail closed with 401 (see apps/api/src/middleware/auth.ts),
  # which is safe but means authentication is effectively unusable until a real value is
  # substituted here. CHANGE_ME is a placeholder, not a usable secret — replace before
  # deploying. See docs/identity-production-requirements.md for the full production
  # identity model (HS256 JWT_SECRET vs. JWKS_URL — choose exactly one) and
  # docs/identity-real-contract.md for why the real askabd-identity service cannot yet
  # be verified by either option (tracked P0, not something this key alone resolves).
  jwt-secret: "CHANGE_ME"
