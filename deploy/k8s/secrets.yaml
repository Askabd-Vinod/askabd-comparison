apiVersion: v1
kind: Secret
metadata:
  name: comparison-secrets
type: Opaque
stringData:
  database-url: "postgresql://comp_user:CHANGE_ME@postgres:5432/comparison"
  # Real askabd-identity tokens are EdDSA-signed (see
  # askabd-identity/src/services/token-service.ts) — jwt-secret (HS256) can NEVER verify
  # them regardless of its value. jwks-url below is the actual production path when
  # verifying real askabd-identity-issued tokens; askabd-identity now persists its
  # signing key and publishes it at GET /.well-known/jwks.json (previously a tracked P0 —
  # see docs/identity-real-contract.md — resolved once askabd-identity's signing key
  # moved from an ephemeral in-memory key to the persisted `signing_key` table).
  # Set jwks-url and leave jwt-secret unset for the real identity integration; jwt-secret
  # remains available only for a separate, symmetric-key issuer of your own.
  jwt-secret: "CHANGE_ME"
  jwks-url: "http://identity-service:4300/.well-known/jwks.json"
