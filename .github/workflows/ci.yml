# AskABD Platform — Continuous Integration
# Reusable CI pipeline for comparison-api.
# Designed for extraction to a shared workflow template.
#
# Quality Gates:
# 1. Install dependencies (with cache)
# 2. TypeScript compilation (zero errors)
# 3. Build (dist output)
# 4. Unit tests (all passing)
# 5. Security audit (no critical vulnerabilities)

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  api:
    name: Comparison API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build -- --skipLibCheck

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=critical || true
        continue-on-error: true
